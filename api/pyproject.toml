[project]
name = "fplai"
version = "0.1.0"
description = "AI-powered Fantasy Premier League squad builder and manager"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "apscheduler>=3.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pulp>=2.8",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "rapidfuzz>=3.6",
    "selectolax>=0.3.21",
    "python-dateutil>=2.9",
    "zstandard>=0.22",
]

[project.optional-dependencies]
extras = [
    "sentence-transformers>=2.6",
    "sqlite-vec>=0.1.1",
    "youtube-transcript-api>=0.6",
    "praw>=7.7",
    "optuna>=3.6",
    "pyarrow>=15.0",
    "soccerdata>=1.8",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hypothesis>=6.100,<6.113",
    "ruff>=0.4",
]

[project.scripts]
fplai = "fplai.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fplai = ["db/*.sql", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"   # datetime.UTC and friends are 3.11+
